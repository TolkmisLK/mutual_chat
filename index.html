<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutual Chat</title><link rel="stylesheet" href="/src/style.css"></head><body><main><header><strong>Mutual Chat</strong><button id="logout" hidden>退出帐号</button></header><section id="login-panel"><div><span class="eyebrow">你的会话，你的应用</span><h1>保持联系。<br>也可以嵌入你的产品。</h1><p>连接自己的 Matrix 服务，在独立窗口或现有应用中使用同一个聊天模块。</p><p class="notice">开发预览：设备验证和密钥恢复流程尚未完成，请先使用测试帐号。</p></div><form id="login"><h2>登录聊天服务</h2><label>服务器地址<input id="server" type="url" placeholder="https://matrix.example.org" required></label><label>用户 ID<input id="user" autocomplete="username" placeholder="@you:example.org" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button id="connect">连接</button><p id="status" role="status"></p></form></section><div id="chat" hidden></div></main><script type="module" src="/src/main.js"></script></body></html>
