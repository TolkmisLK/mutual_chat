<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutual Chat</title><link rel="stylesheet" href="/src/style.css"></head><body><main>
<header><strong>Mutual Chat</strong><div><button id="security" hidden>恢复密钥</button><button id="lock" hidden>锁定</button><button id="logout" hidden>退出帐号</button></div></header><p id="device"></p>
<section id="login-panel"><div><span class="eyebrow">你的会话，你的应用</span><h1>保持联系。<br>也可以嵌入你的产品。</h1><p>连接自己的 Matrix 服务，在独立窗口或现有应用中使用同一个聊天模块。</p><p class="notice">开发预览：设备验证和丢失设备后的密钥恢复尚未完成，请先使用测试帐号。</p></div>
<form id="login"><h2>登录聊天服务</h2><label>服务器地址<input id="server" type="url" placeholder="https://matrix.example.org" required></label><label>用户 ID<input id="user" autocomplete="username" placeholder="@you:example.org" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label>
<label class="check"><input id="remember" type="checkbox">在此浏览器保留会话</label><label id="local-passphrase-label" hidden>本机解锁口令<input id="local-passphrase" type="password" autocomplete="new-password" minlength="12" maxlength="1024"></label><p class="notice">保留会话时请设置独立的长口令，仅用于本机解锁。忘记口令后无法恢复此浏览器的设备密钥。不勾选时仅本次窗口有效。</p><button id="connect">连接</button></form>
<form id="unlock" hidden><h2>解锁本机会话</h2><p>解锁后继续使用原设备和保存在此浏览器中的消息密钥。</p><label>本机解锁口令<input id="unlock-passphrase" type="password" autocomplete="current-password" required minlength="12" maxlength="1024"></label><button id="unlock-button">解锁</button><button id="forget" type="button">忘记本机登录</button><p class="notice">本机口令无法由服务器找回。不要在公共电脑上保留会话。</p></form></section>
<p id="status" role="status"></p><div id="chat" hidden></div></main><script type="module" src="/src/main.js"></script></body></html>
