name: PostgreSQL deployment and recovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  postgres-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.postgres.config.js
      # No reports, traces, snapshots, SQL or service-data artifacts: contain secrets.
